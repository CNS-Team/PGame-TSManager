name: Prune storage (artifacts / caches / releases)

# 一键清理 GitHub Actions 存储占用（Artifacts / Caches / 旧 Release 资产），并每天自动跑一次。
# ⚠ 2026-10-11 策略变更：本仓库**不再在 GitHub 上构建**（只存上游最新源码，构建改本地）。
#    因此默认值改为「全部清空」：artifact_days=0 / cache_days=0 / release_keep=0（保留源码与 tag，只删构建产物）。
# 用法：仓库 → Actions → 本工作流 → Run workflow（可留空用默认值；dry_run=true 只列不删）。
# 权限：仅使用仓库内置 GITHUB_TOKEN（actions:write + contents:write），不需要 PAT。

on:
  push:
    # 自举：本文件被推送/修改时立刻跑一次清理（无需 PAT、也无需手点 Run workflow）
    paths: ['.github/workflows/prune.yml']
  workflow_dispatch:
    inputs:
      artifact_days:
        description: "删除超过 N 天的 Artifacts（0 = 全删）"
        required: false
        default: "0"
      cache_days:
        description: "删除超过 N 天的 Caches（0 = 全删）"
        required: false
        default: "0"
      release_keep:
        description: "保留最近 N 个 Release（其余连资产一起删）"
        required: false
        default: "0"
      run_days:
        description: "顺带删除超过 N 天的已完成 workflow run（0 = 不动；删 run 会连日志一起清）"
        required: false
        default: "0"
      dry_run:
        description: "只列出将要删除的对象，不真删（true/false）"
        required: false
        default: "false"
  schedule:
    - cron: '30 18 * * *'   # 每天 UTC 18:30 = 北京 02:30

permissions:
  actions: write
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune artifacts / caches / releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/$env:REPO"
          $hdr = @{
            Authorization            = "Bearer $env:GH_TOKEN"
            Accept                   = "application/vnd.github+json"
            'X-GitHub-Api-Version'   = "2022-11-28"
            'User-Agent'             = "pigeon-prune"
          }
          $aDays = [int]("${{ github.event.inputs.artifact_days || '0' }}")
          $cDays = [int]("${{ github.event.inputs.cache_days || '0' }}")
          $keep  = [int]("${{ github.event.inputs.release_keep || '0' }}")
          $rDays = [int]("${{ github.event.inputs.run_days || '0' }}")
          $dry   = ("${{ github.event.inputs.dry_run || 'false' }}").ToLower() -eq 'true'
          $now   = [DateTime]::UtcNow
          function Should-Drop([string]$iso, [int]$days) {
            if ($days -le 0) { return $true }
            try { return ($now - ([DateTime]$iso).ToUniversalTime()).TotalDays -gt $days } catch { return $false }
          }
          $sum = [ordered]@{ artifacts = 0; artifactMB = 0.0; caches = 0; cacheMB = 0.0; releases = 0; runs = 0; dryRun = $dry }

          # 1) Artifacts
          $page = 1
          while ($true) {
            $r = Invoke-RestMethod -Headers $hdr -Uri "$api/actions/artifacts?per_page=100&page=$page"
            if (-not $r.artifacts -or $r.artifacts.Count -eq 0) { break }
            foreach ($a in $r.artifacts) {
              if (Should-Drop $a.created_at $aDays) {
                $mb = [math]::Round(([int64]$a.size_in_bytes) / 1MB, 2)
                Write-Host ("ARTIFACT  {0,10} MB  {1}  {2}" -f $mb, $a.created_at, $a.name)
                $sum.artifacts++; $sum.artifactMB += $mb
                if (-not $dry) { Invoke-RestMethod -Method Delete -Headers $hdr -Uri "$api/actions/artifacts/$($a.id)" | Out-Null }
              }
            }
            if ($page * 100 -ge $r.total_count) { break }
            $page++
          }

          # 2) Caches
          $page = 1
          while ($true) {
            $r = Invoke-RestMethod -Headers $hdr -Uri "$api/actions/caches?per_page=100&page=$page"
            if (-not $r.actions_caches -or $r.actions_caches.Count -eq 0) { break }
            foreach ($c in $r.actions_caches) {
              if (Should-Drop $c.created_at $cDays) {
                $mb = [math]::Round(([int64]$c.size_in_bytes) / 1MB, 2)
                Write-Host ("CACHE     {0,10} MB  {1}  {2}  key={3}" -f $mb, $c.created_at, $c.ref, $c.key)
                $sum.caches++; $sum.cacheMB += $mb
                if (-not $dry) { Invoke-RestMethod -Method Delete -Headers $hdr -Uri "$api/actions/caches/$($c.id)" | Out-Null }
              }
            }
            if ($page * 100 -ge $r.total_count) { break }
            $page++
          }

          # 3) Releases（保留最近 N 个，其余连资产一起删）
          $rels = @(Invoke-RestMethod -Headers $hdr -Uri "$api/releases?per_page=100")
          if ($rels.Count -gt $keep) {
            foreach ($rel in ($rels | Sort-Object created_at -Descending | Select-Object -Skip $keep)) {
              $assetBytes = ($rel.assets | Measure-Object -Property size -Sum).Sum
              if (-not $assetBytes) { $assetBytes = 0 }
              $assetMB = [math]::Round(([double]$assetBytes) / 1MB, 2)
              Write-Host ("RELEASE   {0,10} MB  {1}  {2}  (assets={3})" -f $assetMB, $rel.created_at, $rel.tag_name, @($rel.assets).Count)
              $sum.releases++
              if (-not $dry) { Invoke-RestMethod -Method Delete -Headers $hdr -Uri "$api/releases/$($rel.id)" | Out-Null }
            }
          }

          # 4) 可选：删旧 workflow run（连日志一起清）
          if ($rDays -gt 0) {
            $page = 1
            while ($true) {
              $r = Invoke-RestMethod -Headers $hdr -Uri "$api/actions/runs?per_page=100&page=$page"
              if (-not $r.workflow_runs -or $r.workflow_runs.Count -eq 0) { break }
              foreach ($run in $r.workflow_runs) {
                if ($run.status -eq 'completed' -and (Should-Drop $run.created_at $rDays)) {
                  Write-Host ("RUN       {0}  #{1}  {2}  {3}" -f $run.created_at, $run.run_number, $run.name, $run.head_branch)
                  $sum.runs++
                  if (-not $dry) { Invoke-RestMethod -Method Delete -Headers $hdr -Uri "$api/actions/runs/$($run.id)" | Out-Null }
                }
              }
              if ($page * 100 -ge $r.total_count) { break }
              $page++
            }
          }

          Write-Host ""
          Write-Host ("汇总：artifacts={0} ({1} MB) / caches={2} ({3} MB) / releases={4} / runs={5} / dryRun={6}" -f `
            $sum.artifacts, $sum.artifactMB, $sum.caches, $sum.cacheMB, $sum.releases, $sum.runs, $sum.dryRun)
          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              "### Prune 汇总 (dryRun=$($sum.dryRun))"
              ""
              "| 对象 | 数量 | 体积(MB) |"
              "|---|---|---|"
              "| Artifacts | $($sum.artifacts) | $($sum.artifactMB) |"
              "| Caches | $($sum.caches) | $($sum.cacheMB) |"
              "| Releases | $($sum.releases) | - |"
              "| Workflow runs | $($sum.runs) | - |"
            ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
